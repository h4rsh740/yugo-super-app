services:
  - type: web
    name: yugo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma db push
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yugodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: yugodb
    plan: free
    databaseName: yugodb
    user: yugo
